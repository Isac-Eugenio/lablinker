name: lablinker
description: "Aplicativo Flutter para comunicação Bluetooth com Arduino e ESP32, permitindo controle e monitoramento de dispositivos."
publish_to: 'none'
version: 0.0.1+1


environment:
  sdk: ^3.8.1

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter

  flutter_animate: ^4.5.2
  google_fonts: ^6.3.0
  provider: ^6.1.5
  signals: ^6.0.2

  one_of: ^1.5.0

  flutter_bluetooth_classic_serial: ^1.3.2
  page_transition: ^2.2.1
  flutter_launcher_icons: ^0.14.4
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  image_path: 'lib/app/shared/storage/assets/images/LABLINKER.png'

flutter:
  uses-material-design: true

  assets:
    - 'lib/app/shared/storage/assets/images/LABLINKER.png'

